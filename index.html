"use strict";const $=id=>document.getElementById(id),tfs=['1d','1h','15m','5m','1m'];const futureSlots=20;let verticalZoom=1;let viewCount=65,viewOffset=0,gesture=null,suppressTapUntil=0,crosshairIndex=null,futureCrosshairSlot=null;let candles={},last=0,selected=null,position=null,pending=null,logs=[],demo=false,timer=null,axis=null,working=false,lastTickAt=0,priceBusy=false,ws=null,wsRetry=null,wsConnected=false;const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});const fee=.0005,slip=.0001,cost=fee+slip;const won=n=>Math.round(n*(+$("fx").value||1400)).toLocaleString("ko-KR")+"원";const percent=n=>(n>=0?"+":"")+n.toFixed(2)+"%";function netAt(p,market){if(!p)return 0;let exit=market*(p.side==="LONG"?1-slip:1+slip);return (exit-p.entry)*p.qty*(p.side==="LONG"?1:-1)-(p.entry+exit)*p.qty*fee}async function loadFx(){try{let r=await fetch("https://open.er-api.com/v6/latest/USD",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let d=await r.json();let rate=Number(d?.rates?.KRW);if(!(rate>0))throw Error("환율 응답 오류");$("fx").value=rate.toFixed(2);$("fxstatus").textContent="참고 환율 자동 조회: 1 USD ≈ "+fmt(rate)+"원 · 실제 환전 환율과 차이 가능";render()}catch(e){$("fxstatus").textContent="환율 자동 조회 실패 · 입력된 수동 환율로 환산 (실시간 환율 아님)"}}
function ema(a,p){let e=a[0],k=2/(p+1);for(let i=1;i<a.length;i++)e=a[i]*k+e*(1-k);return e}
function trend(a){if(!a||a.length<55)return '대기';let x=a.slice(0,-1).map(v=>v.c);let e=ema(x.slice(-60),20),f=ema(x.slice(-60),50);return e>f*1.0003?'상승':e<f*.9997?'하락':'횡보'}
function render(){ $('balanceSummary').textContent=fmt(+$('balance').value||0)+' USDT';$('pnlSummary').textContent='₩'+Math.round(position?netAt(position,last)*(+$('fx').value||1400):0).toLocaleString('ko-KR'); $('price').textContent=last?fmt(last)+' USDT':'-- USDT';$('mode').textContent=demo?'데모 시세':wsConnected?'실시간 연결':lastTickAt&&Date.now()-lastTickAt<10000?'REST 시세':'연결 대기';$('trends').innerHTML=tfs.map(tf=>{let s=trend(candles[tf]);return '<div class="tf"><b>'+tf+'</b><div class="'+(s==='상승'?'up':s==='하락'?'down':'flat')+'">'+s+'</div></div>'}).join('');$('long').disabled=$('short').disabled=!last||!!position||(!demo&&Date.now()-lastTickAt>10000);draw();drawRmi();updatePosition();calc()}
function calc(){let bal=+$('balance').value||0,r=+$('risk').value/100||0,d=+$('stop').value/100||0,lev=+$('lev').value||1;let n=bal*r/(d+2*cost);n=Math.min(n,bal*lev*.95);$('calc').textContent='예상 포지션 '+won(n)+' (약 '+fmt(n)+' USDT) · 필요 증거금 '+won(n/lev)+' · 손절 예상 비용 포함 손실 '+won(n*(d+2*cost))+' · 계좌 대비 약 -'+(n*(d+2*cost)/bal*100).toFixed(2)+'%'}
let fundingLastAt=0,fundingNextTime=0,fundingLabel='펀딩 --';
function renderFundingCountdown(){const el=$('funding');if(!el)return;let remaining=fundingNextTime-Date.now();if(fundingNextTime>0&&remaining>0){const seconds=Math.ceil(remaining/1000),hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60),secs=seconds%60;el.textContent=fundingLabel+' · '+(hours?hours+'시간 ':'')+minutes+'분 '+String(secs).padStart(2,'0')+'초 뒤'}else if(fundingNextTime>0){el.textContent=fundingLabel+' · 정산 확인 중'}else el.textContent=fundingLabel}
async function updateFunding(){if(demo){fundingNextTime=0;fundingLabel='펀딩: 데모';$('funding').className='funding';renderFundingCountdown();return}try{const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),8000);let res;try{res=await fetch('https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT',{cache:'no-store',signal:ctrl.signal})}finally{clearTimeout(timeout)}if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json(),rate=Number(data.lastFundingRate),next=Number(data.nextFundingTime);if(!Number.isFinite(rate))throw Error('펀딩비 형식 오류');const pct=(rate*100).toFixed(4)+'%';fundingLabel=(rate>0?'롱 지급 ':rate<0?'숏 지급 ':'펀딩 ')+(rate>0?'+':'')+pct;fundingNextTime=Number.isFinite(next)&&next>Date.now()?next:0;$('funding').className='funding '+(rate>0?'long-pays':rate<0?'short-pays':'');$('funding').title='바이낸스 다음 펀딩 시각 기준 남은 시간 · 표시 비율은 정산 전 변동 가능';fundingLastAt=Date.now();renderFundingCountdown()}catch(e){if(!fundingLastAt){fundingNextTime=0;fundingLabel='펀딩 --';$('funding').className='funding'}$('funding').title='펀딩비 조회 실패: '+e.message;renderFundingCountdown()}}

let resizeFrame=0;function refreshChartSize(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if($('page-chart').classList.contains('active')){draw();drawRmi()}})}window.addEventListener('resize',refreshChartSize);if(window.visualViewport)window.visualViewport.addEventListener('resize',refreshChartSize);

for(const el of document.querySelectorAll('.nav-btn'))el.addEventListener('click',()=>switchTab(el.dataset.tab));$('settingsTop').onclick=()=>switchTab('settings');

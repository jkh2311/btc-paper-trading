# Deploy with Render -> New -> Blueprint.
# FREE TEST ONLY: web services sleep when idle and have ephemeral storage.
# It cannot guarantee 24/7 minute-by-minute notifications.
# GitHub Pages cannot run this Web Push sender.
services:
  - type: web
    name: btcusdt-rmi-push
    runtime: node
    rootDir: push-server
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://jkh2311.github.io
      - key: SUBSCRIPTIONS_FILE
        value: /tmp/subscribers.json
      - key: PUSH_REGISTER_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

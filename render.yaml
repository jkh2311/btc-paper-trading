# Deploy with Render -> New -> Blueprint.
# IMPORTANT: starter + persistent disk may incur charges; review before approval.
# GitHub Pages cannot run this Web Push sender.
services:
  - type: web
    name: btcusdt-rmi-push
    runtime: node
    rootDir: push-server
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://jkh2311.github.io
      - key: SUBSCRIPTIONS_FILE
        value: /var/data/subscribers.json
      - key: PUSH_REGISTER_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    disk:
      name: subscriptions
      mountPath: /var/data
      sizeGB: 1
